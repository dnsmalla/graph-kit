# T0 layout spike: Rust port of GraphCore/Layout (2D pipeline, quality metrics excluded).
# Standalone crate on purpose: not a member of rust/Cargo.toml's workspace.
[package]
name = "layout-t0"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "t0native"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
