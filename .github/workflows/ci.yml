name: CI

# The full test matrix. release.yml calls this workflow (workflow_call) so a tagged
# release runs exactly the same jobs before it publishes anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Tag runs (release) are never cancelled by a newer push.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  swift:
    name: Swift (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: swift build
        run: swift build
      - name: swift test
        run: swift test

  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ["18", "20"]
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test

  schema:
    name: Schema conformance (fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate fixtures against the canonical JSON Schema
        run: |
          npx --yes ajv-cli@5 validate \
            -s schema/graph.schema.json \
            -d "schema/fixtures/*.json" \
            --spec=draft2020

  # The Rust crate (rust/os-graph) runs with the rustc recorded in web/src/wasm/bytes.ts,
  # the version the committed WASM was built with. Pinning it here keeps the check honest.
  rust:
    name: Rust (os-graph, rustc from bytes.ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the rustc version recorded in bytes.ts
        id: rustc
        run: |
          v=$(sed -n 's#^// rustc: rustc \([0-9][0-9.]*\) .*#\1#p' web/src/wasm/bytes.ts | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::no '// rustc: rustc X.Y.Z' header in web/src/wasm/bytes.ts"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rustc.outputs.version }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test --release
        working-directory: rust
        run: cargo test --release
      - name: cargo clippy (native)
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (wasm feature)
        working-directory: rust
        run: cargo clippy --all-targets --features wasm -- -D warnings

  # Fails when the committed WASM is not a fresh build with the recorded rustc and the
  # wasm-bindgen CLI locked in rust/Cargo.lock. Same script as the local check.
  wasm:
    name: WASM reproducibility (build-os-wasm.sh --check --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Informational until it has passed once on Linux: the committed bytes were built on
    # macOS (aarch64) and a Linux build is not yet proven byte-identical. When it first
    # passes, delete this line; if it fails, diff graph_kit_os.js/.d.ts, compare the wasm
    # custom sections and embedded paths, then rebuild the committed bytes on Linux.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Read the rustc version recorded in bytes.ts
        id: rustc
        run: |
          v=$(sed -n 's#^// rustc: rustc \([0-9][0-9.]*\) .*#\1#p' web/src/wasm/bytes.ts | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::no '// rustc: rustc X.Y.Z' header in web/src/wasm/bytes.ts"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Read the wasm-bindgen version locked in rust/Cargo.lock
        id: bindgen
        run: |
          v=$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' rust/Cargo.lock | head -n 1)
          if [ -z "$v" ]; then
            echo "::error::no wasm-bindgen entry in rust/Cargo.lock"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rustc.outputs.version }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Cache the wasm-bindgen CLI
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.bindgen.outputs.version }}-${{ runner.os }}
      - name: Install the wasm-bindgen CLI at the locked version
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --version "${{ steps.bindgen.outputs.version }}" wasm-bindgen-cli
      - name: build-os-wasm.sh --check --strict
        id: check
        env:
          OS_WASM_TOOLCHAIN: ${{ steps.rustc.outputs.version }}
        run: scripts/build-os-wasm.sh --check --strict
      # Diagnostics when the Linux build differs from the committed (macOS-built) bytes:
      # regenerate in place and upload the result so it can be diffed against the committed files.
      - name: Regenerate in place (diagnostics)
        if: failure() && steps.check.outcome == 'failure'
        env:
          OS_WASM_TOOLCHAIN: ${{ steps.rustc.outputs.version }}
        run: |
          scripts/build-os-wasm.sh || true
          sha256sum web/src/wasm/bytes.ts web/src/wasm/pkg/* || true
      - name: Upload the Linux-built files
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wasm-linux-build
          path: |
            web/src/wasm/bytes.ts
            web/src/wasm/pkg/
          retention-days: 7

  web:
    name: Web page (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            typescript/package-lock.json
      # web/ type-checks against typescript/src (models.ts imports zod), so install those too.
      - name: Install typescript/ dependencies (types the page imports)
        working-directory: typescript
        run: npm ci
      - run: npm ci
      - run: npm run type-check
      - run: npm test
