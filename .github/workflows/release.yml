name: Release

# Tag-driven release: push a semver tag and this workflow re-runs the full CI matrix
# (ci.yml, including the Rust crate, the web page and the WASM reproducibility check),
# creates a GitHub Release, and publishes the TypeScript package to npm when an
# NPM_TOKEN secret is configured.
#
# Tag form: the canonical tag is plain `X.Y.Z` (e.g. `1.6.0`). `vX.Y.Z` is accepted too.
# The version is the tag without its `v`; it must equal typescript/package.json's version.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  ci:
    name: Full test matrix
    uses: ./.github/workflows/ci.yml

  verify:
    name: Verify tag, package version and CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches typescript/package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg_ver=$(node -p "require('./typescript/package.json').version")
          if [ "$pkg_ver" != "$version" ]; then
            echo "::error::typescript/package.json ($pkg_ver) != tag ($version)"
            exit 1
          fi
      - name: CHANGELOG has a section for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

  release:
    name: GitHub Release + npm publish
    needs: [ci, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ {flag=0}
            flag' CHANGELOG.md > release-notes.md
          test -s release-notes.md || echo "See CHANGELOG.md." > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm (skipped when NPM_TOKEN is not configured)
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping npm publish."
            exit 0
          fi
          npm ci
          npm publish --access public
